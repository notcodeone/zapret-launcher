# Релиз по тегу: git tag v0.2.0 && git push origin v0.2.0
# Собирает установщик и публикует его в GitHub Releases — оттуда его находит самообновление лаунчера.
# Версия в теге должна совпадать с pubspec.yaml и AppInfo.version (lib/src/app_info.dart).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Установщик
        shell: pwsh
        run: ./tool/build_installer.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/ZapretLauncher-Setup-*.exe
          generate_release_notes: true
